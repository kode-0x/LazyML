[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazyml"
version = "0.1.0"
description = "LazyML command-line tool for automated machine learning on CSV datasets"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Author", email = "author@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
boost = ["xgboost>=2.0.0", "lightgbm>=4.0.0", "catboost>=1.2.0"]
optuna = ["optuna>=3.0.0"]
tui = ["textual>=0.41.0"]
imbalanced = ["imbalanced-learn>=0.11.0"]
dev = ["pytest>=7.0", "mypy>=1.0", "ruff>=0.1.0"]
docs = [
    "sphinx>=7.0",
    "furo>=2023.9.10",
    "myst-parser>=2.0",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-copybutton>=0.5",
]

[project.scripts]
lazyml = "lazyml.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lazyml"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_ignores = true
